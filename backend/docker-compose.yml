services:
  redis:
    image: redis:7
    container_name: odessa-redis
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: odessa-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      

  backend:
    build:
      context: .   # ✅ FIXED
    container_name: odessa-backend

    depends_on:
      - redis
      - elasticsearch

    env_file:
      - .env

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ELASTICSEARCH_NODE: http://elasticsearch:9200

      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MONGO_URI: ${MONGO_URI}
      OAUTH_TOKEN_SECRET: ${OAUTH_TOKEN_SECRET}

    ports:
      - "5000:5000"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock